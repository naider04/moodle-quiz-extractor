<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodle Quiz Collector</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ─── Login ─── -->
<div id="login-screen" class="screen active">
  <div class="card">
    <h1>📚 Moodle Quiz Collector</h1>
    <p class="subtitle">Extract all your quiz questions into a study guide</p>
    <form id="login-form">
      <label for="moodle-url">Moodle URL</label>
      <input type="text" id="moodle-url" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="aulagradob.unemi.edu.ec (https:// opcional)" required>
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="your_username" required>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="your_password" required>
      <div id="login-error" class="error hidden"></div>
      <button type="submit" id="login-btn">Log In & Collect</button>
    </form>
  </div>
</div>

<!-- ─── Progress / Result ─── -->
<div id="progress-screen" class="screen">
  <div class="card">
    <h1>⏳ Collecting quizzes…</h1>
    <p id="user-info" class="subtitle"></p>
    <div id="log-box">
      <div id="log-messages"></div>
    </div>
    <div id="progress-bar-container" class="hidden">
      <div id="progress-bar"></div>
    </div>
    <div id="result-box" class="hidden">
      <div id="result-summary"></div>
      <div id="guide"></div>
      <button id="new-btn" class="btn secondary" onclick="showLogin()">Collect Another Account</button>
    </div>

    <!-- Floating widget: shows the quiz/attempt currently in view -->
    <div id="float-box" class="hidden">
      <div class="float-label">Viendo</div>
      <div id="float-quiz-name"></div>
      <a id="float-attempt-link" target="_blank" rel="noopener">Abrir intento</a>
    </div>
  </div>
</div>

<!-- ─── Simulador: práctica con el banco de preguntas (Firestore) ─── -->
<div id="simulator" class="hidden">
  <div class="sim-wrap">
    <div class="sim-header">
      <div class="sim-titles">
        <div class="sim-title" id="sim-title"></div>
        <div class="sim-sub" id="sim-sub"></div>
      </div>
      <div class="sim-score" id="sim-score"></div>
      <button id="sim-close" class="sim-btn ghost" type="button" title="Cerrar simulador">✕</button>
    </div>
    <div id="sim-body"></div>
    <div class="sim-nav">
      <button id="sim-prev" class="sim-btn" type="button">← Anterior</button>
      <button id="sim-check" class="sim-btn primary" type="button">Comprobar</button>
      <button id="sim-next" class="sim-btn" type="button">Siguiente →</button>
    </div>
  </div>
</div>

<script>
// Image position marker (text → break → image → break → text, like Moodle).
const IMG_T = '\u0002';
const IMG_TOKEN_RE = new RegExp(IMG_T + '([^' + IMG_T + ']+)' + IMG_T, 'g');
const $loginScreen = document.getElementById('login-screen');
const $progressScreen = document.getElementById('progress-screen');
const $loginForm = document.getElementById('login-form');
const $loginBtn = document.getElementById('login-btn');
const $loginError = document.getElementById('login-error');
const $userInfo = document.getElementById('user-info');
const $logBox = document.getElementById('log-box');
const $logMessages = document.getElementById('log-messages');
const $resultBox = document.getElementById('result-box');
const $resultSummary = document.getElementById('result-summary');
const $floatBox = document.getElementById('float-box');
const $floatQuizName = document.getElementById('float-quiz-name');
const $floatLink = document.getElementById('float-attempt-link');
const quizRegistry = [];
let lastFloat = null;

function showLogin() {
  $loginScreen.classList.add('active');
  $progressScreen.classList.remove('active');
  $loginBtn.disabled = false;
  $loginBtn.textContent = 'Log In & Collect';
  $logMessages.innerHTML = '';
  $resultBox.classList.add('hidden');
  document.getElementById('guide').innerHTML = '';
  quizRegistry.length = 0;
  lastFloat = null;
  $floatBox.classList.add('hidden');
}

function addLog(msg) {
  const div = document.createElement('div');
  div.textContent = msg;
  $logMessages.appendChild(div);
  // #log-box is the scrollable element (max-height + overflow-y:auto);
  // scrolling #log-messages alone has no effect.
  $logBox.scrollTop = $logBox.scrollHeight;
}

$loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  $loginError.classList.add('hidden');
  $loginBtn.disabled = true;
  $loginBtn.textContent = 'Logging in…';

  const moodleUrl = document.getElementById('moodle-url').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    // Step 1: Login
    addLog('Authenticating…');
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ moodleUrl, username, password }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Login failed.');

    addLog(`✓ Logged in as ${data.fullname}`);
    $userInfo.textContent = data.fullname;

    // Switch to progress screen
    $loginScreen.classList.remove('active');
    $progressScreen.classList.add('active');
    $resultBox.classList.add('hidden');
    $logMessages.innerHTML = '';
    addLog(`Starting collection on ${data.baseUrl}…`);

    // Step 2: SSE for collection progress
    const evtSource = new EventSource(
      `/api/collect?baseUrl=${encodeURIComponent(data.baseUrl)}&token=${encodeURIComponent(data.token)}&userId=${data.userId}`
    );

    evtSource.addEventListener('progress', (e) => {
      const { message } = JSON.parse(e.data);
      addLog(message);
    });

    evtSource.addEventListener('done', async (e) => {
      const result = JSON.parse(e.data);
      evtSource.close();
      addLog('\n═══ DONE ═══');
      addLog(`${result.questionCount} questions (${result.correctCount} correct)`);
      addLog(`${result.mediaCount} media files downloaded`);
      $resultSummary.innerHTML = `
        <div class="result-stats">
          <div class="stat"><span class="stat-num">${result.questionCount}</span> questions</div>
          <div class="stat"><span class="stat-num">${result.correctCount}</span> correct</div>
          <div class="stat"><span class="stat-num">${result.mediaCount}</span> media</div>
        </div>`;
      // Render the questions online
      try {
        const res = await fetch('/api/result');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderGuide(await res.json());
      } catch (err) {
        addLog(`⚠ No se pudieron cargar las preguntas: ${err.message}`);
      }
      $resultBox.classList.remove('hidden');
    });

    evtSource.addEventListener('error', (e) => {
      try {
        const data = JSON.parse(e.data);
        addLog(`❌ Error: ${data.message}`);
      } catch {
        addLog('❌ Connection lost.');
      }
      evtSource.close();
      $resultBox.classList.remove('hidden');
    });

    evtSource.onerror = () => {
      // SSE connection closed (could be normal end or error)
      evtSource.close();
    };
  } catch (err) {
    $loginError.textContent = err.message;
    $loginError.classList.remove('hidden');
    $loginBtn.disabled = false;
    $loginBtn.textContent = 'Log In & Collect';
  }
});

// ─── Online study-guide rendering ──────────────────────────────────
function toggleAll(btn) {
  const open = document.querySelectorAll('#guide .course-quizzes.open, #guide .quiz-body.open');
  const closed = document.querySelectorAll('#guide .course-quizzes:not(.open), #guide .quiz-body:not(.open)');
  if (closed.length > 0) {
    closed.forEach((el) => el.classList.add('open'));
    btn.textContent = 'Colapsar todo';
  } else {
    open.forEach((el) => el.classList.remove('open'));
    btn.textContent = 'Expandir todo';
  }
  updateFloat();
}

// Appends plain text and <img> elements to container. \u0002url\u0002 markers
// become images (feedback text uses this; question text uses innerHTML because
// it already contains intentional ddwtos-answer markup).
function appendRichText(container, text, imgMap, imgClass, alt) {
  const parts = String(text || '').split(IMG_T);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const url = parts[i];
      if (!url) continue;
      const local = imgMap ? imgMap.get(url) : null;
      const el = document.createElement('img');
      el.className = imgClass;
      el.alt = alt;
      el.loading = 'lazy';
      el.src = local ? `/resources/${encodeURIComponent(local)}` : url;
      container.appendChild(el);
    } else if (parts[i]) {
      container.appendChild(document.createTextNode(parts[i]));
    }
  }
}

function renderQuestion(q) {
  const div = document.createElement('div');
  div.className = 'q';

  const num = document.createElement('div');
  num.className = 'q-num ' + (q.isCorrect ? 'correct' : q.isWrong ? 'wrong' : 'partial');
  num.textContent = q.isCorrect
    ? `P${q.questionNumber} — ✓ Correcta`
    : q.isWrong
      ? `P${q.questionNumber} — ✗ Incorrecta`
      : `P${q.questionNumber} — ${q.markObtained}/${q.markMax}`;
  div.appendChild(num);

  const type = document.createElement('div');
  type.className = 'q-type';
  type.textContent = q.type;
  div.appendChild(type);

  const text = document.createElement('div');
  // ddwtos/gapselect answers are green only when the question earned max
  // grade; since we can't know which gaps are correct otherwise, they stay
  // neutral gray.
  text.className = (q.type === 'ddwtos' || q.type === 'gapselect') && q.isCorrect ? 'q-text ddwtos-ok' : 'q-text';
  // For ddwtos questions the collector already substitutes each gap's answer
  // into the question text. If old data still contains placeholder spans
  // (<span class="placeN">…</span>), fill them in here as a fallback.
  let processedText = q.questionText;
  if (q.type === 'ddwtos' && q.subQuestions && q.subQuestions.length) {
    q.subQuestions.forEach((sub, index) => {
      const placeholderRegex = new RegExp(`(<span class="place${index + 1}">)[^<]*(</span>)`, 'g');
      processedText = processedText.replace(placeholderRegex, `$1${sub.selectedText || ''}$2`);
    });
  }
  // Images embedded in the question text keep their position in the flow
  // (text → break → image → break → text, just like Moodle).
  const imgMap = new Map((q.images || []).map((i) => [i.url, i.localFile]));
  const renderedInText = new Set();
  processedText = processedText.replace(IMG_TOKEN_RE, (m, url) => {
    renderedInText.add(url);
    const local = imgMap.get(url);
    const src = local ? `/resources/${encodeURIComponent(local)}` : url;
    return `<img class="q-img" alt="question image" loading="lazy" src="${src.replace(/"/g, '&quot;')}">`;
  });
  text.innerHTML = processedText;
  div.appendChild(text);

  // Fallback: images not embedded in the text (e.g. multianswer) and not part
  // of the feedback are appended after the question.
  const feedbackImgUrls = new Set((q.feedbackImages || []).map((i) => i.url));
  for (const img of q.images || []) {
    if (renderedInText.has(img.url) || feedbackImgUrls.has(img.url)) continue;
    const el = document.createElement('img');
    el.className = 'q-img';
    el.alt = 'question image';
    el.loading = 'lazy';
    el.src = img.localFile ? `/resources/${encodeURIComponent(img.localFile)}` : img.url;
    div.appendChild(el);
  }

  // Audio players
  for (const a of (q.audios || [])) {
    const el = document.createElement('audio');
    el.className = 'q-audio';
    el.controls = true;
    el.preload = 'none';
    el.src = a.localFile ? `/resources/${encodeURIComponent(a.localFile)}` : a.url;
    div.appendChild(el);
  }

  // Sub-questions (multianswer / cloze).
  // ddwtos answers are already substituted into the question text, so we
  // skip the raw draggable-choices list for that type.
  if (q.type !== 'ddwtos') {
  for (const sub of (q.subQuestions || [])) {
    const subDiv = document.createElement('div');
    subDiv.className = 'sub-q';

    if (sub.questionText) {
      const stemEl = document.createElement('div');
      stemEl.className = 'sub-q-text';
      stemEl.textContent = sub.questionText;
      subDiv.appendChild(stemEl);
    }

    if (sub.type === 'select') {
      // Match question row → show only the student's choice, boxed so it's
      // clearly the selected answer (separate from the prompt above it).
      const cls = sub.isCorrect ? 'correct' : sub.isIncorrect ? 'wrong' : q.isCorrect ? 'correct' : q.isWrong ? 'wrong' : 'partial';
      const ansEl = document.createElement('div');
      ansEl.className = 'sub-answer ' + cls;
      ansEl.textContent = sub.selectedText || '— (sin selección)';
      subDiv.appendChild(ansEl);
    } else if (sub.options && sub.options.length > 0) {
      for (const opt of sub.options) {
        let cls = 'not-selected';
        if (opt.markedCorrect) cls = 'correct';
        else if (opt.markedIncorrect && opt.selected) cls = 'selected-wrong';
        else if (sub.isCorrect && opt.selected) cls = 'correct';
        else if (sub.isIncorrect && opt.selected) cls = 'selected-wrong';
        else if (!sub.isCorrect && !sub.isIncorrect && opt.selected) cls = 'selected';
        const optEl = document.createElement('div');
        optEl.className = 'sub-opt ' + cls;
        const strong = document.createElement('strong');
        strong.textContent = opt.letter;
        optEl.appendChild(strong);
        if (opt.text) optEl.appendChild(document.createTextNode(' ' + opt.text));
        subDiv.appendChild(optEl);
      }
    } else if (sub.selectedText) {
      const ansEl = document.createElement('div');
      ansEl.className = 'sub-answer ' + (sub.isCorrect ? 'correct' : sub.isIncorrect ? 'wrong' : 'partial');
      ansEl.textContent = sub.selectedText;
      subDiv.appendChild(ansEl);
    }

    div.appendChild(subDiv);
  }
  }

  const isPartial = !q.isCorrect && !q.isWrong;
  for (const opt of q.options) {
    let cls = 'not-selected';
    if (opt.markedCorrect) cls = 'correct';
    else if (opt.markedIncorrect && opt.selected) cls = 'selected-wrong';
    else if (q.isCorrect && opt.selected) cls = 'correct';
    else if (q.isWrong && opt.selected) cls = 'selected-wrong';
    else if (isPartial && opt.selected) cls = 'selected';
    const el = document.createElement('div');
    el.className = 'opt ' + cls;
    const strong = document.createElement('strong');
    strong.textContent = opt.letter;
    el.appendChild(strong);
    if (opt.text) el.appendChild(document.createTextNode(' ' + opt.text));
    for (const img of (opt.optionImages || [])) {
      el.appendChild(document.createElement('br'));
      const imgEl = document.createElement('img');
      imgEl.className = 'opt-img';
      imgEl.alt = 'option image';
      imgEl.src = img.localFile ? `/resources/${encodeURIComponent(img.localFile)}` : img.url;
      el.appendChild(imgEl);
    }
    div.appendChild(el);
  }

  if (q.essayResponse) {
    const lbl = document.createElement('div');
    lbl.className = 'essay-label';
    lbl.textContent = 'Tu respuesta:';
    div.appendChild(lbl);
    const resp = document.createElement('div');
    resp.className = 'essay-response';
    resp.textContent = q.essayResponse;
    div.appendChild(resp);
  }

  if (q.feedback) {
    const fb = document.createElement('div');
    fb.className = 'feedback';
    appendRichText(fb, q.feedback, new Map((q.feedbackImages || []).map((i) => [i.url, i.localFile])), 'q-img', 'feedback image');
    div.appendChild(fb);
  }

  return div;
}

function updateFloat() {
  const guideVisible = !$resultBox.classList.contains('hidden');
  const mid = window.innerHeight / 2;
  let hit = null;
  if (guideVisible) {
    for (const entry of quizRegistry) {
      if (!entry.attemptsData.length) continue;
      const r = entry.el.getBoundingClientRect();
      if (r.top <= mid && r.bottom >= mid) {
        let attempt = entry.attemptsData[0];
        if (entry.attemptsData.length > 1) {
          const hdrs = entry.el.querySelectorAll('.attempt-hdr');
          for (let i = 0; i < hdrs.length; i++) {
            if (hdrs[i].getBoundingClientRect().top <= mid) attempt = entry.attemptsData[i];
          }
        }
        hit = { entry, attempt };
        break;
      }
    }
  }
  if (hit) lastFloat = hit;
  const cur = hit || lastFloat;
  if (!cur || !guideVisible) {
    $floatBox.classList.add('hidden');
    return;
  }
  $floatBox.classList.remove('hidden');
  const multi = cur.entry.attemptsData.length > 1;
  $floatQuizName.textContent = multi ? `${cur.entry.name} — Intento ${cur.attempt.attemptNumber}` : cur.entry.name;
  if (cur.entry.cmid && cur.attempt.attemptId != null) {
    $floatLink.href = `${cur.entry.baseUrl}/mod/quiz/review.php?attempt=${cur.attempt.attemptId}&cmid=${cur.entry.cmid}`;
    $floatLink.classList.remove('disabled');
    $floatLink.textContent = `Abrir intento ${cur.attempt.attemptNumber}`;
  } else {
    $floatLink.removeAttribute('href');
    $floatLink.classList.add('disabled');
    $floatLink.textContent = 'Sin enlace de revisión';
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updateFloat), { passive: true });
window.addEventListener('resize', updateFloat);

function renderGuide(allData) {
  const guide = document.getElementById('guide');
  guide.innerHTML = '';
  quizRegistry.length = 0;
  lastFloat = null;

  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = `
    <span><span class="dot g"></span> Correcta</span>
    <span><span class="dot r"></span> Incorrecta (tu respuesta)</span>
    <span><span class="dot y"></span> Parcial / Info</span>`;
  guide.appendChild(legend);

  const expandBtn = document.createElement('button');
  expandBtn.className = 'expand-btn';
  expandBtn.textContent = 'Expandir todo';
  expandBtn.type = 'button';
  expandBtn.onclick = () => toggleAll(expandBtn);
  guide.appendChild(expandBtn);

  for (const server of allData) {
    const host = server.baseUrl.replace('https://', '');
    const serverHdr = document.createElement('div');
    serverHdr.className = 'server-hdr';
    const h2 = document.createElement('h2');
    h2.textContent = host;
    serverHdr.appendChild(h2);
    guide.appendChild(serverHdr);

    for (const course of server.courses) {
      const totalQ = course.quizzes.reduce((s, q) => s + q.questions.length, 0);
      const correctQ = course.quizzes.reduce((s, q) => s + q.questions.filter((x) => x.isCorrect).length, 0);

      const courseBlk = document.createElement('div');
      courseBlk.className = 'course-blk';

      const courseTitle = document.createElement('div');
      courseTitle.className = 'course-title';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = course.name;
      const simBtn = document.createElement('button');
      simBtn.type = 'button';
      simBtn.className = 'sim-start';
      simBtn.textContent = '▶ Iniciar Simulador';
      simBtn.title = 'Practicar con el banco de preguntas únicas de esta materia';
      simBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startSimulator(server.baseUrl, course);
      });
      const statsSpan = document.createElement('span');
      statsSpan.className = 'stats';
      statsSpan.textContent = `${course.quizzes.length} quizzes · ${correctQ}/${totalQ} correctas`;
      courseTitle.append(nameSpan, simBtn, statsSpan);

      const courseQuizzes = document.createElement('div');
      courseQuizzes.className = 'course-quizzes';
      courseTitle.addEventListener('click', () => courseQuizzes.classList.toggle('open'));

      for (const quiz of course.quizzes) {
        const quizCorrect = quiz.questions.filter((q) => q.isCorrect).length;
        const quizTotal = quiz.questions.length;

        const quizBlk = document.createElement('div');
        quizBlk.className = 'quiz-blk';

        const quizHdr = document.createElement('div');
        quizHdr.className = 'quiz-hdr';
        const left = document.createElement('div');
        const nameEl = document.createElement('span');
        nameEl.className = 'name';
        nameEl.textContent = quiz.name;
        if (quiz.cmid) {
          const link = document.createElement('a');
          link.className = 'quiz-link';
          link.href = `${server.baseUrl}/mod/quiz/view.php?id=${quiz.cmid}`;
          link.target = '_blank';
          link.rel = 'noopener';
          link.title = `Abrir "${quiz.name}" en Moodle`;
          link.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H5v12h12v-6h2v8H3V5h2z"/></svg>';
          link.addEventListener('click', (e) => e.stopPropagation());
          nameEl.appendChild(link);
        }
        const infoEl = document.createElement('div');
        infoEl.className = 'info';
        infoEl.textContent = `${quiz.attempts} intento(s) · ${quizCorrect}/${quizTotal} correctas`;
        left.append(nameEl, infoEl);

        const scoreEl = document.createElement('span');
        scoreEl.className = 'score';
        scoreEl.style.color =
          quiz.bestGrade >= quiz.sumGrades ? '#69f0ae' : quiz.bestGrade > 0 ? '#ffd740' : '#ff5252';
        scoreEl.textContent = quiz.bestGrade != null ? `${quiz.bestGrade}/${quiz.sumGrades}` : '?';
        quizHdr.append(left, scoreEl);

        const quizBody = document.createElement('div');
        quizBody.className = 'quiz-body';
        quizHdr.addEventListener('click', () => quizBody.classList.toggle('open'));

        // All finished attempts, or a single synthetic attempt for old data.
        const attemptsData = quiz.attemptsData ||
          (quiz.questions && quiz.questions.length
            ? [{ attemptNumber: 1, score: quiz.bestGrade, questions: quiz.questions }]
            : []);

        if (!attemptsData.length) {
          const noReview = document.createElement('div');
          noReview.className = 'no-review';
          noReview.textContent = 'No se pudo obtener la revisión';
          quizBody.appendChild(noReview);
        } else {
          for (const attempt of attemptsData) {
            if (attemptsData.length > 1) {
              const attHdr = document.createElement('div');
              attHdr.className = 'attempt-hdr';
              attHdr.textContent =
                `Intento ${attempt.attemptNumber} — ${attempt.score != null ? attempt.score + '/' + quiz.sumGrades : '?'}`;
              quizBody.appendChild(attHdr);
            }
            for (const q of attempt.questions) quizBody.appendChild(renderQuestion(q));
          }
        }

        quizRegistry.push({ el: quizBody, name: quiz.name, baseUrl: server.baseUrl, cmid: quiz.cmid, attemptsData });
        quizBlk.append(quizHdr, quizBody);
        courseQuizzes.appendChild(quizBlk);
      }

      courseBlk.append(courseTitle, courseQuizzes);
      guide.appendChild(courseBlk);
    }
  }
  updateFloat();
}

// ─── Simulador: práctica con el banco de preguntas únicas (Firestore) ──
const $simulator = document.getElementById('simulator');
const $simTitle = document.getElementById('sim-title');
const $simSub = document.getElementById('sim-sub');
const $simScore = document.getElementById('sim-score');
const $simBody = document.getElementById('sim-body');
const $simPrev = document.getElementById('sim-prev');
const $simNext = document.getElementById('sim-next');
const $simCheck = document.getElementById('sim-check');
const $simClose = document.getElementById('sim-close');

let simState = null; // { questions, index, answers }
let simCoursesCache = null;

async function startSimulator(baseUrl, course) {
  try {
    if (!simCoursesCache) {
      const res = await fetch('/api/simulator/courses');
      if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
      simCoursesCache = await res.json();
    }
    const entry = simCoursesCache.find(
      (c) => c.baseUrl === baseUrl && String(c.courseId) === String(course.courseId),
    );
    if (!entry) {
      alert('Aún no hay banco de preguntas subido para esta materia.');
      return;
    }
    const res = await fetch('/api/simulator/course?course=' + encodeURIComponent(entry.courseKey));
    if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
    const data = await res.json();
    if (!data.questions.length) throw new Error('El banco de esta materia no tiene preguntas.');

    simState = {
      questions: data.questions,
      index: 0,
      answers: data.questions.map(() => ({ picked: [], checked: false, markObtained: 0, markMax: 0 })),
    };
    $simTitle.textContent = data.name;
    $simSub.textContent = `${data.questionCount} preguntas únicas · ${data.quizzes.length} quizzes`;
    $simulator.classList.remove('hidden');
    renderSimQuestion();
  } catch (err) {
    alert('No se pudo iniciar el simulador: ' + err.message);
  }
}

$simClose.addEventListener('click', () => {
  $simulator.classList.add('hidden');
  simState = null;
});

$simPrev.addEventListener('click', () => {
  if (simState && simState.index > 0) {
    simState.index--;
    renderSimQuestion();
  }
});

$simNext.addEventListener('click', () => {
  if (simState && simState.index < simState.questions.length - 1) {
    simState.index++;
    renderSimQuestion();
  }
});

$simCheck.addEventListener('click', () => {
  if (!simState) return;
  const a = simState.answers[simState.index];
  if (a.checked) return;
  buildAttempt(simState.questions[simState.index], a); // computes marks
  a.checked = true;
  renderSimQuestion();
});

function simScoreText() {
  let got = 0;
  let max = 0;
  for (const a of simState.answers) {
    if (a.markMax > 0) {
      got += a.markObtained || 0;
      max += a.markMax;
    }
  }
  return `Puntos: ${Math.round(got * 100) / 100} / ${max}`;
}

function renderSimQuestion() {
  const q = simState.questions[simState.index];
  const a = simState.answers[simState.index];
  $simBody.innerHTML = '';
  $simScore.textContent = simScoreText();

  const meta = document.createElement('div');
  meta.className = 'sim-meta';
  meta.textContent = `Pregunta ${simState.index + 1} de ${simState.questions.length}`;
  if (q.sourceQuiz) meta.textContent += ` · Quiz: ${q.sourceQuiz}`;
  $simBody.appendChild(meta);

  if (a.checked) {
    $simBody.appendChild(renderQuestion(buildAttempt(q, a)));
    $simCheck.disabled = true;
    $simCheck.textContent = '✓ Comprobada';
  } else {
    $simBody.appendChild(renderSimAnswer(q, a));
    $simCheck.disabled = false;
    $simCheck.textContent = 'Comprobar';
  }
  $simPrev.disabled = simState.index === 0;
  $simNext.disabled = simState.index === simState.questions.length - 1;

  if (simState.answers.every((x) => x.checked)) {
    $simBody.appendChild(simSummary());
  }
}

// Flow markers inside ddwtos/gapselect question text: image tokens or gap spans.
const simFlowRe = new RegExp('(' + IMG_T + '[^' + IMG_T + ']+' + IMG_T + ')|(<span class="ddwtos-answer">…</span>)', 'g');
const simImgPartRe = new RegExp('^' + IMG_T + '([^' + IMG_T + ']+)' + IMG_T + '$');
const simGapPartRe = /^<span class="ddwtos-answer">…<\/span>$/;

function makeGapSelect(q, a, gapIndex) {
  const opts = q.options || [];
  if (!opts.length) {
    const span = document.createElement('span');
    span.className = 'ddwtos-answer';
    span.textContent = '…';
    return span;
  }
  const sel = document.createElement('select');
  sel.className = 'sim-gap';
  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = '— elegir —';
  sel.appendChild(blank);
  opts.forEach((o, oi) => {
    const optEl = document.createElement('option');
    optEl.value = String(oi);
    optEl.textContent = o.text;
    sel.appendChild(optEl);
  });
  sel.value = a.picked[gapIndex] != null ? String(a.picked[gapIndex]) : '';
  sel.addEventListener('change', () => {
    a.picked[gapIndex] = sel.value === '' ? null : parseInt(sel.value, 10);
  });
  return sel;
}

// Answer phase: interactive controls, one per question type.
function renderSimAnswer(q, a) {
  const div = document.createElement('div');

  const num = document.createElement('div');
  num.className = 'q-num bank';
  num.textContent = `P${q.questionNumber}`;
  div.appendChild(num);

  const type = document.createElement('div');
  type.className = 'q-type';
  type.textContent = q.type;
  div.appendChild(type);

  const text = document.createElement('div');
  text.className = 'q-text';
  const imgMap = new Map((q.images || []).map((i) => [i.url, i.localFile]));
  const isGapType = q.type === 'ddwtos' || q.type === 'gapselect';

  if (isGapType) {
    // Flow: text / image / gap-select in the original order.
    const parts = String(q.questionText || '').split(simFlowRe);
    let gapIndex = 0;
    for (const part of parts) {
      if (!part) continue;
      const imgM = part.match(simImgPartRe);
      const gapM = part.match(simGapPartRe);
      if (imgM) {
        const local = imgMap.get(imgM[1]);
        const imgEl = document.createElement('img');
        imgEl.className = 'q-img';
        imgEl.alt = 'question image';
        imgEl.loading = 'lazy';
        imgEl.src = local ? `/resources/${encodeURIComponent(local)}` : imgM[1];
        text.appendChild(imgEl);
      } else if (gapM) {
        text.appendChild(makeGapSelect(q, a, gapIndex));
        gapIndex++;
      } else {
        text.appendChild(document.createTextNode(part));
      }
    }
    const hint = document.createElement('div');
    hint.className = 'sim-hint';
    hint.textContent = 'Elige una opción para cada espacio.';
    div.appendChild(hint);
    const choices = document.createElement('div');
    choices.className = 'sim-choices';
    for (const o of q.options || []) {
      const chip = document.createElement('span');
      chip.className = 'sim-chip';
      chip.textContent = o.text;
      choices.appendChild(chip);
    }
    div.appendChild(choices);
  } else {
    const renderedInText = new Set();
    let processedText = String(q.questionText || '').replace(IMG_TOKEN_RE, (m, url) => {
      renderedInText.add(url);
      const local = imgMap.get(url);
      const src = local ? `/resources/${encodeURIComponent(local)}` : url;
      return `<img class="q-img" alt="question image" loading="lazy" src="${src.replace(/"/g, '&quot;')}">`;
    });
    text.innerHTML = processedText;
    for (const img of q.images || []) {
      if (renderedInText.has(img.url)) continue;
      const imgEl = document.createElement('img');
      imgEl.className = 'q-img';
      imgEl.alt = 'question image';
      imgEl.loading = 'lazy';
      imgEl.src = img.localFile ? `/resources/${encodeURIComponent(img.localFile)}` : img.url;
      text.appendChild(imgEl);
    }
  }
  div.appendChild(text);

  for (const aud of q.audios || []) {
    const el = document.createElement('audio');
    el.className = 'q-audio';
    el.controls = true;
    el.preload = 'none';
    el.src = aud.localFile ? `/resources/${encodeURIComponent(aud.localFile)}` : aud.url;
    div.appendChild(el);
  }

  if (isGapType) {
    // controls already rendered inside the text flow
  } else if (q.type === 'multichoice' || q.type === 'truefalse') {
    const single = q.type === 'truefalse';
    (q.options || []).forEach((o, oi) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'sim-opt' + (a.picked.includes(oi) ? ' picked' : '');
      const strong = document.createElement('strong');
      strong.textContent = o.letter;
      el.appendChild(strong);
      if (o.text) el.appendChild(document.createTextNode(' ' + o.text));
      for (const img of o.optionImages || []) {
        el.appendChild(document.createElement('br'));
        const imgEl = document.createElement('img');
        imgEl.className = 'opt-img';
        imgEl.alt = 'option image';
        imgEl.src = img.localFile ? `/resources/${encodeURIComponent(img.localFile)}` : img.url;
        el.appendChild(imgEl);
      }
      el.addEventListener('click', () => {
        if (single) a.picked = a.picked[0] === oi ? [] : [oi];
        else a.picked = a.picked.includes(oi) ? a.picked.filter((x) => x !== oi) : [...a.picked, oi];
        const next = renderSimAnswer(q, a);
        const meta = $simBody.querySelector('.sim-meta');
        $simBody.innerHTML = '';
        if (meta) $simBody.appendChild(meta);
        $simBody.appendChild(next);
      });
      div.appendChild(el);
    });
  } else if (q.subQuestions && q.subQuestions.length) {
    // match / multianswer: one pick per stem
    q.subQuestions.forEach((sub, si) => {
      const subDiv = document.createElement('div');
      subDiv.className = 'sub-q';
      if (sub.questionText) {
        const stemEl = document.createElement('div');
        stemEl.className = 'sub-q-text';
        stemEl.textContent = sub.questionText;
        subDiv.appendChild(stemEl);
      }
      const sel = document.createElement('select');
      sel.className = 'sim-gap';
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = '— elegir —';
      sel.appendChild(blank);
      (sub.options || []).forEach((o, oi) => {
        const optEl = document.createElement('option');
        optEl.value = String(oi);
        optEl.textContent = o.text;
        sel.appendChild(optEl);
      });
      sel.value = a.picked[si] != null ? String(a.picked[si]) : '';
      sel.addEventListener('change', () => {
        a.picked[si] = sel.value === '' ? null : parseInt(sel.value, 10);
      });
      subDiv.appendChild(sel);
      div.appendChild(subDiv);
    });
  } else if (q.type === 'essay') {
    const ta = document.createElement('textarea');
    ta.className = 'sim-essay';
    ta.placeholder = 'Escribe tu respuesta aquí…';
    ta.value = a.picked[0] || '';
    ta.addEventListener('input', () => {
      a.picked[0] = ta.value;
    });
    div.appendChild(ta);
  } else {
    const hint = document.createElement('div');
    hint.className = 'sim-hint';
    hint.textContent = 'Pulsa «Comprobar» para ver la respuesta correcta y el feedback.';
    div.appendChild(hint);
  }
  return div;
}

// Turn a bank question + the user's picks into the attempt-like shape
// renderQuestion() expects, computing marks as a side effect.
function buildAttempt(q, a) {
  const copy = {
    ...q,
    options: (q.options || []).map((o) => ({ ...o, selected: false, markedIncorrect: false })),
    subQuestions: (q.subQuestions || []).map((s) => ({
      ...s,
      options: (s.options || []).map((o) => ({ ...o, selected: false, markedIncorrect: false })),
      selectedText: s.selectedText || '',
      isCorrect: false,
      isIncorrect: false,
    })),
  };
  const markMax = q.markMax > 0 ? q.markMax : 1;
  const isGapType = q.type === 'ddwtos' || q.type === 'gapselect';

  if (isGapType) {
    // Substitute the chosen option into each gap box, in order.
    let gi = 0;
    copy.questionText = String(q.questionText || '').replace(
      /(<span class="ddwtos-answer">)[\s\S]*?(<\/span>)/g,
      (m, p1, p2) => {
        const val = a.picked ? a.picked[gi] : null;
        const choice = val != null && q.options && q.options[val] ? q.options[val].text : '…';
        gi++;
        return p1 + choice + p2;
      },
    );
    copy.isCorrect = false;
    copy.isWrong = false;
    copy.markObtained = 0;
    copy.markMax = 0;
    // The choice pool is only for the answer phase; hide it on reveal so it
    // doesn't render as a duplicate option list next to the question.
    copy.options = [];
    a.markObtained = 0;
    a.markMax = 0; // not scored (no per-gap correctness in the bank)
    return copy;
  }

  if (q.type === 'multichoice' || q.type === 'truefalse') {
    const correctIdx = new Set(
      (q.options || []).map((o, i) => (o.markedCorrect ? i : -1)).filter((i) => i >= 0),
    );
    const picked = new Set(a.picked || []);
    copy.options.forEach((o, i) => {
      o.selected = picked.has(i);
      o.markedIncorrect = picked.has(i) && !o.markedCorrect;
    });
    if (correctIdx.size === 0) {
      // Nobody ever answered it correctly, so the right answer is unknown:
      // show the user's picks in neutral, not as wrong.
      copy.options.forEach((o, i) => {
        o.selected = picked.has(i);
        o.markedIncorrect = false;
      });
      copy.isCorrect = false;
      copy.isWrong = false;
      copy.markObtained = 0;
      copy.markMax = 0;
      a.markObtained = 0;
      a.markMax = 0;
    } else {
      let matched = 0;
      for (const i of picked) if (correctIdx.has(i)) matched++;
      const exact = picked.size === correctIdx.size && [...correctIdx].every((i) => picked.has(i));
      const pct = exact ? 1 : matched / correctIdx.size;
      copy.isCorrect = exact;
      copy.isWrong = !exact && matched === 0;
      copy.markObtained = Math.round(pct * markMax * 100) / 100;
      copy.markMax = markMax;
      a.markObtained = copy.markObtained;
      a.markMax = markMax;
    }
    return copy;
  }

  if (q.subQuestions && q.subQuestions.length) {
    // match / multianswer: one selection per stem.
    let scored = 0;
    let total = 0;
    copy.subQuestions = copy.subQuestions.map((s, si) => {
      const corrIdx = (s.options || []).findIndex((o) => o.markedCorrect);
      const pickedVal = a.picked ? a.picked[si] : null;
      const userOpt = pickedVal != null && s.options[pickedVal] ? s.options[pickedVal] : null;
      s.selectedText = userOpt ? userOpt.text : '';
      if (corrIdx >= 0) {
        total++;
        if (userOpt && corrIdx === pickedVal) {
          s.isCorrect = true;
          s.isIncorrect = false;
          scored++;
        } else {
          s.isCorrect = false;
          s.isIncorrect = true;
        }
      } else {
        s.isCorrect = false;
        s.isIncorrect = false;
      }
      s.options.forEach((o, oi) => {
        o.selected = oi === pickedVal;
        o.markedIncorrect = oi === pickedVal && !o.markedCorrect;
      });
      return s;
    });
    if (total === 0) {
      copy.isCorrect = false;
      copy.isWrong = false;
      copy.markObtained = 0;
      copy.markMax = 0;
      a.markObtained = 0;
      a.markMax = 0;
    } else {
      const pct = scored / total;
      copy.isCorrect = scored === total;
      copy.isWrong = scored === 0;
      copy.markObtained = Math.round(pct * markMax * 100) / 100;
      copy.markMax = markMax;
      a.markObtained = copy.markObtained;
      a.markMax = markMax;
    }
    return copy;
  }

  if (q.type === 'essay') {
    copy.essayResponse = (a.picked && a.picked[0]) || '';
  }
  copy.isCorrect = false;
  copy.isWrong = false;
  copy.markObtained = 0;
  copy.markMax = 0;
  a.markObtained = 0;
  a.markMax = 0;
  return copy;
}

function simSummary() {
  let got = 0;
  let max = 0;
  let correct = 0;
  let partial = 0;
  let wrong = 0;
  let unscored = 0;
  for (const a of simState.answers) {
    if (a.markMax > 0) {
      got += a.markObtained || 0;
      max += a.markMax;
      if (a.markObtained >= a.markMax) correct++;
      else if (a.markObtained > 0) partial++;
      else wrong++;
    } else {
      unscored++;
    }
  }
  const wrap = document.createElement('div');
  wrap.className = 'sim-summary';
  const title = document.createElement('div');
  title.className = 'sim-summary-title';
  title.textContent = 'Resumen de la práctica';
  wrap.appendChild(title);
  const stats = document.createElement('div');
  stats.className = 'sim-summary-stats';
  stats.textContent =
    `✓ ${correct} correctas · ` +
    `≈ ${partial} parciales · ` +
    `✗ ${wrong} incorrectas` +
    (unscored ? ` · ${unscored} sin calificar (texto/reordenar)` : '');
  wrap.appendChild(stats);
  const score = document.createElement('div');
  score.className = 'sim-summary-score';
  score.textContent = `Puntuación: ${Math.round(got * 100) / 100} / ${max}`;
  wrap.appendChild(score);
  const restart = document.createElement('button');
  restart.type = 'button';
  restart.className = 'sim-btn primary';
  restart.textContent = '↻ Reiniciar';
  restart.addEventListener('click', () => {
    simState.answers = simState.questions.map(() => ({ picked: [], checked: false, markObtained: 0, markMax: 0 }));
    simState.index = 0;
    renderSimQuestion();
  });
  wrap.appendChild(restart);
  return wrap;
}
</script>
